name: validate-rules

# Structural validation of the ruleset: frontmatter against the adapter schemas,
# cross-reference and Markdown-link resolution, section anchors, MCP-only router
# targets, the 16 KiB always-on byte budget of AGENTS.md and the load-set budgets
# (per rule, full-cycle set, subagent start set). The bodies of the
# routed standards live in the 1C-docs-mcp repository, so the router/body heading
# sync runs only locally (tools/validate-rules.ps1 -StandardsDir <path>); in CI it
# is skipped with a notice. See tools/validate-rules.ps1.
#
# Jobs cover the content skills and both metadata-tool runtimes:
#   content-skills (linux) — real DOCX output and offline Gemini model selection.
#   validate (windows) — the ruleset validator, the PowerShell tool regressions,
#     the full Python suite including the PowerShell/Python parity and
#     installer packaging gates, which need a PowerShell host (--strict: a case
#     skipped for a missing PowerShell host fails the job), and the opt-in
#     support-guard hook of the Claude Code plugin against the PowerShell guard.
#   python-ports (linux) — the safety contract of the Python ports on the
#     platform they exist for. Runs with --python-only, so the PowerShell-bound
#     cases are skipped rather than silently passing.
#
# Tests do not reach the network: they use local fixtures and mocked API calls.
# Runtime dependencies (docx and lxml) are installed explicitly below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOCX runtime
        run: npm ci --prefix content/skills/md-to-docx --ignore-scripts --no-audit --no-fund
      - name: Markdown to DOCX regressions
        run: python -B tools/tests/md-to-docx-regression.py
      - name: Transcription model regressions (offline)
        run: python -B tools/tests/transcribe-regression.py

  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python port dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check "lxml>=4.9.0"

      # Windows PowerShell 5.1 — the interpreter the validator is tested against
      # locally and the one install.ps1 targets.
      - name: Validate ruleset structure
        shell: powershell
        run: .\tools\validate-rules.ps1

      - name: Tool policy settings migration
        shell: powershell
        run: .\tools\tests\tool-policy-settings.ps1

      - name: Optional initial source dump
        shell: powershell
        run: .\tools\tests\initial-source-dump.ps1

      - name: Scheduled MCP source refresh
        shell: powershell
        run: .\tools\tests\files-update-task.ps1

      # The acceptance corpus must still render into eval cases. Running them needs a
      # model and live MCP servers, so CI only proves the corpus and the renderer
      # agree; the rendered cases are run with `claude plugin eval` before a release.
      - name: Render gate evals
        shell: powershell
        run: .\tools\render-gate-evals.ps1 -OutDir "$env:RUNNER_TEMP\gate-evals"

      # Behaviour regressions for the meta-edit / meta-compile tool scripts of the
      # 1c-metadata-manage skill. Same interpreter, no 1C platform needed: the cases
      # materialize their own fixtures and assert on the resulting bytes.
      - name: Metadata tool regressions
        shell: powershell
        run: .\tools\tests\metadata-tools-regression.ps1

      # cfe-borrow / cfe-validate against Configurator's borrowed-object shapes.
      - name: Extension borrow regressions
        shell: powershell
        run: .\tools\tests\cfe-borrow-regression.ps1

      # db-* / epf-* launch tools against a fake 1cv8.exe compiled by the suite: trap exit code,
      # load-mode resolution, smuggled batch keys, repository credentials and masking, /DumpResult.
      - name: Database tool regressions (fake platform)
        shell: powershell
        run: .\tools\tests\db-tools-regression.ps1

      # web-* PowerShell scripts end to end against a fake httpd.exe (no Apache, no 1C).
      - name: Web publication regressions (PowerShell)
        shell: powershell
        run: .\tools\tests\web-ops-regression.ps1

      # repo-ops against a fake 1cv8.exe and sample repository logs (no platform).
      - name: Repository operation regressions
        shell: powershell
        run: .\tools\tests\repo-ops-regression.ps1

      # Marketplace wrapper: DryRun plans only, no network, no install.ps1 write.
      - name: Marketplace bootstrap
        shell: powershell
        run: .\tools\tests\marketplace-bootstrap.ps1

      - name: Agent adapter install lifecycle
        shell: powershell
        run: .\tools\tests\agent-adapters.ps1

      - name: Installer paths and source discovery
        shell: powershell
        run: .\tools\tests\installer-paths-regression.ps1

      - name: Preserve OpenCode configs (PowerShell 5.1)
        shell: powershell
        run: .\tools\tests\opencode-config-preservation.ps1

      - name: Preserve OpenCode configs (PowerShell 7)
        shell: pwsh
        run: .\tools\tests\opencode-config-preservation.ps1

      # Full Python suite: the port safety contract plus the two gates that need a
      # PowerShell host — remove-form PS/Python parity and installer packaging.
      # -B keeps CI from writing __pycache__ into the checked-out tree.
      - name: Python port regressions (with PowerShell parity)
        shell: powershell
        run: python -B "tools/tests/python-ports-regression.py" --strict

      - name: Python web operation regressions (offline)
        shell: powershell
        run: python -B "tools/tests/web-python-regression.py"

      # plugins/1c-rules/hooks: the Node hook and the PowerShell guard of the
      # vendored tools must reach the same verdict on the same synthetic dumps.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Support-guard hook (Node hook vs PowerShell guard)
        shell: powershell
        run: .\tools\tests\support-guard-hook.ps1 -RequireNode

  python-ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python port dependencies
        run: python -m pip install --disable-pip-version-check "lxml>=4.9.0"

      # The reason the ports exist: a Linux install has to be able to run them.
      # --python-only skips the cases that need a PowerShell host; Windows owns
      # those. -B keeps __pycache__ out of the tree.
      - name: Python port safety contract
        run: python -B "tools/tests/python-ports-regression.py" --python-only

      - name: Python web operation regressions (offline)
        run: python -B "tools/tests/web-python-regression.py"
